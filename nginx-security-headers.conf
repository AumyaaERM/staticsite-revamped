# Nginx Security Headers Configuration
# Copy these lines into your nginx server block

# Anti-Clickjacking Protection
add_header X-Frame-Options "DENY" always;

# Content Security Policy
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://docs.google.com https://www.googletagmanager.com; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; form-action 'self' https://docs.google.com; base-uri 'self'; frame-ancestors 'none'; object-src 'none';" always;

# Prevent MIME type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Referrer Policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# XSS Protection (legacy browsers)
add_header X-XSS-Protection "1; mode=block" always;

# Permissions Policy
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

# HSTS - Force HTTPS
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Usage example:
# server {
#     listen 443 ssl http2;
#     server_name yourdomain.com;
#
#     # Include these headers
#     include /path/to/nginx-security-headers.conf;
#
#     # Your other configuration...
# }
