<!doctype html>
<html lang="en-IN">
  <head>
    <!-- Google tag (gtag.js) — config in /gtag-init.js so production CSP (no inline scripts) still allows it -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TBDNTEW5S3"></script>
    <script src="/gtag-init.js"></script>

    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo-removebg.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Preload critical images for hero section -->
    <link rel="preload" as="image" href="/images/home/tc1.png" />

    <!-- Preconnect to external domains for faster loading -->
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://www.youtube-nocookie.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- seo:start — replaced per page at build time by scripts/vite-plugin-seo.ts (source: src/config/seo.ts) -->
    <title>Aumyaa Consulting | AI-Enabled Business Consulting &amp; Risk Advisory</title>
    <meta name="description" content="Aumyaa Consulting Services LLP is an AI-enabled business consulting and risk advisory firm in India offering technology, risk, ESG, compliance and DPDP advisory, executive coaching and training." />
    <link rel="canonical" href="https://aumyaa.com/" />
    <!-- seo:end -->
    <meta name="theme-color" content="#FCD421" />
    <link rel="apple-touch-icon" href="/images/seo/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
